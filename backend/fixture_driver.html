<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Traffix phone connection test</title>
<style>body{font:18px system-ui;background:#101926;color:#edf3fa;max-width:600px;margin:auto;padding:24px}button,input{font:inherit;padding:14px;border-radius:8px;margin:8px 0;max-width:100%;box-sizing:border-box}button{background:#9ee5cf;border:0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1d2c40;padding:16px}label{display:block}</style>
<h1>Traffix</h1><p>FAKE FIXTURE · simulated vehicle · no GPS</p>
<p id="status" role="status">Enter your join code</p>
<form id="claim"><label>Join code <input id="code" required autocomplete="off"></label><button>Connect</button></form>
<label><input type="checkbox" id="share" disabled> Share probe samples</label>
<p id="role"></p><pre id="frame">Waiting for a frame</pre><p id="ack"></p>
<script>
let claim=JSON.parse(sessionStorage.getItem('traffix.claim')||'null'), socket, timer, retry=0;
let seq=Number(sessionStorage.getItem('traffix.seq')||0);
const status=document.getElementById('status'), share=document.getElementById('share');
const fragment=new URLSearchParams(location.hash.slice(1));
document.getElementById('code').value=fragment.get('join')||'';
history.replaceState(null,'',location.pathname);
function send(type,payload,time=null){
 if(!socket||socket.readyState!==1)return;
 seq++; sessionStorage.setItem('traffix.seq',seq);
 socket.send(JSON.stringify({v:1,type,msg_id:'msg.phone.'+seq,run_id:claim.run_id,sender_id:claim.session_id,seq,sim_time_s:time,payload}));
}
function connect(){
 status.textContent='Connecting…';share.disabled=true;
 socket=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
 socket.onopen=()=>send('session.hello',{token:claim.token,last_server_seq:0});
 socket.onmessage=e=>{
  const m=JSON.parse(e.data);
  if(m.type==='session.ready'){
   retry=0;status.textContent='Connected';share.disabled=false;
   document.getElementById('claim').hidden=true;
   document.getElementById('role').textContent='You are '+m.payload.vehicle_id+' (simulated)';
   clearInterval(timer);timer=setInterval(()=>send('heartbeat',{visible:!document.hidden}),2000);
  }
  if(m.type==='world.snapshot')share.checked=m.payload.drivers[0]?.reporting||false;
  if(m.type==='vehicle.frame'){
   document.getElementById('frame').textContent=JSON.stringify(m.payload,null,2)+'\nSimulation time: '+m.sim_time_s+' s';
   if(share.checked&&m.payload.state==='active')send('probe.sample',{frame_id:m.payload.frame_id,vehicle_id:m.payload.vehicle_id,pose:m.payload.pose},m.sim_time_s);
  }
  if(m.type==='ack')document.getElementById('ack').textContent=m.payload.status+': '+m.payload.reason;
 };
 socket.onclose=e=>{
  clearInterval(timer);share.disabled=true;status.textContent='Disconnected';
  if(e.code===1008&&e.reason!=='heartbeat_timeout'){
   status.textContent='Session ended. Enter a new code if the server restarted.';
   sessionStorage.removeItem('traffix.claim');document.getElementById('claim').hidden=false;return;
  }
  if(e.reason==='replaced_by_reconnect')return;
  setTimeout(connect,[1000,2000,4000][Math.min(retry++,2)]);
 };
}
share.onchange=()=>send('probe.toggle',{enabled:share.checked});
document.getElementById('claim').onsubmit=async e=>{
 e.preventDefault();
 try{
  const res=await fetch('/api/claim',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({join_code:document.getElementById('code').value.trim()})});
  const data=await res.json();if(!res.ok)throw new Error(data.detail);
  claim=data;seq=0;sessionStorage.setItem('traffix.claim',JSON.stringify(claim));sessionStorage.setItem('traffix.seq','0');connect();
 }catch(error){status.textContent=error.message;}
};
if(claim)connect();
</script></html>
